name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # 1. Official Screenshot 2 Clean Player Restore
      - name: Restore Official DetailScreen
        run: |
          git remote add upstream https://github.com/solo12345689/AnyFilm.git || true
          git fetch upstream
          git checkout upstream/main -- app/src/main/java/com/example/ui/screens/DetailScreen.kt || \
          git checkout upstream/master -- app/src/main/java/com/example/ui/screens/DetailScreen.kt

      # 2. Universal Brightness & Volume Gestures Injection
      - name: Inject Gestures to PlayerView
        run: |
          python3 -c '
          import re, os, glob

          gesture_code = """
              var touchStartY = 0f
              var touchStartX = 0f
              var isLeft = false
              setOnTouchListener { view, event ->
                  when (event.action) {
                      android.view.MotionEvent.ACTION_DOWN -> {
                          touchStartY = event.y
                          touchStartX = event.x
                          isLeft = touchStartX < (view.width / 2)
                          false
                      }
                      android.view.MotionEvent.ACTION_MOVE -> {
                          val deltaY = touchStartY - event.y
                          if (Math.abs(deltaY) > 20) {
                              if (isLeft) {
                                  val act = view.context as? android.app.Activity
                                  act?.let {
                                      val lp = it.window.attributes
                                      val cur = if (lp.screenBrightness < 0) 0.5f else lp.screenBrightness
                                      lp.screenBrightness = (cur + (deltaY / view.height) * 0.15f).coerceIn(0.01f, 1.0f)
                                      it.window.attributes = lp
                                  }
                              } else {
                                  val am = view.context.getSystemService(android.content.Context.AUDIO_SERVICE) as android.media.AudioManager
                                  val max = am.getStreamMaxVolume(android.media.AudioManager.STREAM_MUSIC)
                                  val cur = am.getStreamVolume(android.media.AudioManager.STREAM_MUSIC)
                                  val step = if (deltaY > 0) 1 else -1
                                  am.setStreamVolume(android.media.AudioManager.STREAM_MUSIC, (cur + step).coerceIn(0, max), 0)
                              }
                              touchStartY = event.y
                              true
                          } else {
                              false
                          }
                      }
                      else -> false
                  }
              }
          """

          files_to_check = glob.glob("app/src/main/java/com/example/ui/screens/*.kt")
          for file_path in files_to_check:
              with open(file_path, "r") as f:
                  code = f.read()

              if "PlayerView" in code:
                  print(f"Found PlayerView in {file_path}")
                  # Case 1: PlayerView(...).apply {
                  if re.search(r"PlayerView\s*\([^)]*\)\s*\.apply\s*\{", code):
                      code = re.sub(r"(PlayerView\s*\([^)]*\)\s*\.apply\s*\{)", r"\1\n" + gesture_code, code)
                  # Case 2: PlayerView(...) apply {
                  elif re.search(r"PlayerView\s*\([^)]*\)\s*apply\s*\{", code):
                      code = re.sub(r"(PlayerView\s*\([^)]*\)\s*apply\s*\{)", r"\1\n" + gesture_code, code)
                  # Case 3: Just PlayerView(...)
                  else:
                      code = re.sub(r"(PlayerView\s*\([^)]*\))", r"\1.apply {\n" + gesture_code + "\n}", code)

                  with open(file_path, "w") as f:
                      f.write(code)
                  print(f"Successfully injected gestures into {file_path}!")
          '

      # 3. Google Services Missing Fix
      - name: Generate Dummy google-services.json
        run: |
          mkdir -p app
          PKG=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' app/build.gradle* 2>/dev/null || grep -oP 'package="\K[^"]+' app/src/main/AndroidManifest.xml 2>/dev/null || echo "com.solo.anyfilm")
          cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "anyfilm-app",
              "storage_bucket": "anyfilm-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "$PKG"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "dummy_api_key"}],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567891",
                  "android_client_info": {
                    "package_name": "com.solo.anyfilm"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "dummy_api_key"}],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567892",
                  "android_client_info": {
                    "package_name": "com.example"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "dummy_api_key"}],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # 4. JVM & Headless
      - name: Setup JVM & Gradle Properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -Djava.awt.headless=true" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvm.options=-Djava.awt.headless=true" >> ~/.gradle/gradle.properties

      # 5. Build APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-App
          path: app/build/outputs/apk/debug/*.apk
