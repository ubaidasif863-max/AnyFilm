name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # 1. Clean DetailScreen Restore
      - name: Restore Working DetailScreen
        run: |
          git checkout HEAD -- app/src/main/java/com/example/ui/screens/DetailScreen.kt || true

      # 2. Find Exact Player Location in Project
      - name: Locate Player File
        run: |
          echo "=== SEARCHING FOR PLAYERVIEW IN APP ==="
          grep -rn "PlayerView" app/src/main/java/ || true
          echo "=== SEARCHING FOR EXOPLAYER IN APP ==="
          grep -rn "ExoPlayer" app/src/main/java/ || true

      # 3. Google Services Missing Fix
      - name: Generate Dummy google-services.json
        run: |
          mkdir -p app
          PKG=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' app/build.gradle* 2>/dev/null || grep -oP 'package="\K[^"]+' app/src/main/AndroidManifest.xml 2>/dev/null || echo "com.solo.anyfilm")
          cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "anyfilm-app",
              "storage_bucket": "anyfilm-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "$PKG"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "dummy_api_key"}],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567891",
                  "android_client_info": {
                    "package_name": "com.solo.anyfilm"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "dummy_api_key"}],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567892",
                  "android_client_info": {
                    "package_name": "com.example"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "dummy_api_key"}],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # 4. JVM & Headless
      - name: Setup JVM & Gradle Properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -Djava.awt.headless=true" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvm.options=-Djava.awt.headless=true" >> ~/.gradle/gradle.properties

      # 5. Build APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-App
          path: app/build/outputs/apk/debug/*.apk
