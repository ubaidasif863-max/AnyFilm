name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # 1. Clean Screenshot 2 Player Restore
      - name: Restore Official DetailScreen
        run: |
          git remote add upstream https://github.com/solo12345689/AnyFilm.git || true
          git fetch upstream
          git checkout upstream/main -- app/src/main/java/com/example/ui/screens/DetailScreen.kt || \
          git checkout upstream/master -- app/src/main/java/com/example/ui/screens/DetailScreen.kt

      # 2. Native GestureDetector for Brightness & Volume
      - name: Inject Gestures to Video Player
        run: |
          python3 -c '
          import os, glob, re

          gesture_logic = """
              val gestureDetector = android.view.GestureDetector(context, object : android.view.GestureDetector.SimpleOnGestureListener() {
                  override fun onDown(e: android.view.MotionEvent): Boolean = true
                  override fun onScroll(e1: android.view.MotionEvent?, e2: android.view.MotionEvent, distanceX: Float, distanceY: Float): Boolean {
                      if (e1 == null) return false
                      if (Math.abs(distanceY) > Math.abs(distanceX)) {
                          val isLeft = e1.x < (width / 2)
                          if (isLeft) {
                              val act = context as? android.app.Activity
                              act?.let {
                                  val lp = it.window.attributes
                                  val cur = if (lp.screenBrightness < 0) 0.5f else lp.screenBrightness
                                  lp.screenBrightness = (cur + (distanceY / height) * 0.8f).coerceIn(0.01f, 1.0f)
                                  it.window.attributes = lp
                              }
                          } else {
                              val am = context.getSystemService(android.content.Context.AUDIO_SERVICE) as android.media.AudioManager
                              val max = am.getStreamMaxVolume(android.media.AudioManager.STREAM_MUSIC)
                              val cur = am.getStreamVolume(android.media.AudioManager.STREAM_MUSIC)
                              val step = if (distanceY > 0) 1 else -1
                              am.setStreamVolume(android.media.AudioManager.STREAM_MUSIC, (cur + step).coerceIn(0, max), android.media.AudioManager.FLAG_SHOW_UI)
                          }
                          return true
                      }
                      return false
                  }
              })
              setOnTouchListener { _, event ->
                  gestureDetector.onTouchEvent(event)
              }
          """

          for root, dirs, files in os.walk("app/src/main/java"):
              for file in files:
                  if file.endswith(".kt"):
                      file_path = os.path.join(root, file)
                      with open(file_path, "r") as f:
                          code = f.read()

                      if "PlayerView" in code:
                          print(f"Injecting gestures into: {file_path}")
                          if "apply {" in code:
                              code = re.sub(r"(PlayerView[^\n]*apply\s*\{)", r"\1\n" + gesture_logic, code, count=1)
                          else:
                              code = re.sub(r"(PlayerView\s*\([^)]*\))", r"\1.apply {\n" + gesture_logic + "\n}", code, count=1)

                          with open(file_path, "w") as f:
                              f.write(code)
          '

      # 3. Google Services Missing Fix
      - name: Generate Dummy google-services.json
        run: |
          mkdir -p app
          PKG=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' app/build.gradle* 2>/dev/null || grep -oP 'package="\K[^"]+' app/src/main/AndroidManifest.xml 2>/dev/null || echo "com.solo.anyfilm")
          cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "anyfilm-app",
              "storage_bucket": "anyfilm-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "$PKG"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "dummy_api_key"}],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567891",
                  "android_client_info": {
                    "package_name": "com.solo.anyfilm"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "dummy_api_key"}],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567892",
                  "android_client_info": {
                    "package_name": "com.example"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "dummy_api_key"}],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # 4. JVM & Headless
      - name: Setup JVM & Gradle Properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -Djava.awt.headless=true" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvm.options=-Djava.awt.headless=true" >> ~/.gradle/gradle.properties

      # 5. Build APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-App
          path: app/build/outputs/apk/debug/*.apk
